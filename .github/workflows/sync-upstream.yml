# =============================================================================
# 编排器：同步上游 + 自动构建（Android + Windows）
# 将具体功能委派给 3 个可复用 Workflow：
#   1. sync-upstream-check.yml    — 版本检测
#   2. sync-upstream-build.yml    — 同步 + Android 构建 + 发布
#   3. sync-upstream-win.yml      — Windows 构建（追加到已有 Release）
# =============================================================================
name: Sync Upstream & Auto Build

on:
  schedule:
    # 每天 UTC 6:00 自动检查上游更新
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      build_mode:
        description: '构建模式'
        required: false
        default: 'sync'
        type: choice
        options:
          - sync
          - local
      tag:
        description: 'sync 模式=上游 Tag（留空自动获取最新版）；local 模式=基准 Tag（留空自动获取上游最新）'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  issues: write

# 防止并发：一次只运行一个同步任务
concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_OWNER: bggRGjQaUbCoE
  UPSTREAM_REPO: PiliPlus

jobs:
  # ──────────────────────────────────────────────
  # Job 1: 版本检测
  # ──────────────────────────────────────────────
  check:
    name: 🔍 解析版本
    uses: ./.github/workflows/sync-upstream-check.yml
    with:
      tag: ${{ github.event.inputs.tag || '' }}
      build_mode: ${{ github.event.inputs.build_mode || 'sync' }}
    secrets: inherit

  # ──────────────────────────────────────────────
  # Job 2: 同步 + Android 构建 + 发布
  # ──────────────────────────────────────────────
  sync_and_build:
    name: 🔄 同步并构建 Android
    needs: check
    if: needs.check.outputs.has_update == 'true'
    uses: ./.github/workflows/sync-upstream-build.yml
    with:
      new_tag: ${{ needs.check.outputs.new_tag }}
      build_mode: ${{ github.event.inputs.build_mode || 'sync' }}
    secrets: inherit

  # ──────────────────────────────────────────────
  # Job 3: Windows 构建（追加到已有 Release）
  # ──────────────────────────────────────────────
  build_windows:
    name: 🪟 构建 Windows
    needs: [check, sync_and_build]
    if: needs.sync_and_build.outputs.should_build == 'true'
    uses: ./.github/workflows/sync-upstream-win.yml
    with:
      release_tag: ${{ needs.sync_and_build.outputs.release_tag }}
      suffix: ${{ needs.sync_and_build.outputs.suffix }}
      version_suffix: ${{ needs.sync_and_build.outputs.version_suffix }}
    secrets: inherit
